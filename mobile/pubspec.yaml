name: agroscan
description: AgroScan — offline on-device plant disease screening (Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  camera: ^0.12.0+1
  image_picker: ^1.2.2
  permission_handler: ^12.0.1
  tflite_flutter: ^0.12.1
  image: ^4.5.4
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/agroscan_launcher.png
  adaptive_icon_background: "#FDFCF8"
  adaptive_icon_foreground: assets/branding/agroscan_launcher_foreground.png
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/agroscan_logo.svg
    - assets/models/agroscan_baseline_float.tflite
    - assets/models/labels.json
    - assets/models/gradcam_classifier_weights.bin
    - assets/models/gradcam_classifier_weights.json
    - assets/advice/diseases_fr.json
